name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore PawsPost.slnx

      - name: Build with warnings as errors
        run: dotnet build PawsPost.slnx --no-restore -warnaserror

      - name: Run tests
        run: dotnet test PawsPost.slnx --no-build --verbosity normal

      - name: Check formatting
        run: dotnet format PawsPost.slnx --verify-no-changes --no-restore
